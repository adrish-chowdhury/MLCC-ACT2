<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Healing Storage</title>
<style>
  :root { --bg:#0b1020; --card:#151c33; --line:#27304d; --text:#e6e9f5; --mute:#8b93b3; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --acc:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Segoe UI",sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:19px; } .live { color:var(--ok); font-size:12px; } .live::before { content:"● "; animation:b 1.2s infinite; } @keyframes b { 50% { opacity:.3; } }
  main { max-width:1000px; margin:0 auto; padding:22px; display:grid; gap:18px; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .tab { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; text-align:left; color:inherit; font:inherit; }
  .tab.active { border-color:var(--acc); }
  .tab b { font-size:15px; } .tab .n { font-size:26px; font-weight:700; display:block; margin-top:4px; }
  .mute { color:var(--mute); font-size:12px; word-break:break-all; }
  .pill { display:inline-block; padding:1px 9px; border-radius:999px; font-size:11px; font-weight:600; margin-left:6px; }
  .ok { background:#064e3b; color:var(--ok); } .bad { background:#4c0519; color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:22px; text-align:center; color:var(--mute); cursor:pointer; }
  #drop.over { border-color:var(--acc); color:var(--text); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); } th { color:var(--mute); font-weight:500; font-size:12px; }
  button.del { background:none; border:1px solid var(--line); color:var(--bad); border-radius:8px; padding:4px 10px; cursor:pointer; }
  button.del:hover { border-color:var(--bad); }
  #log { height:170px; overflow:auto; font:12px ui-monospace,Consolas,monospace; background:#080c18; border-radius:8px; padding:10px; }
  .t { color:var(--mute); }
  @media (max-width:640px) { .tabs { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>Self-Healing Storage</h1><span class="live">live · refreshing every 2s</span></header>
<main>
  <div class="tabs">
    <button class="tab active" id="tabA"></button>
    <button class="tab" id="tabB"></button>
  </div>

  <div class="card">
    <h2>Upload to <span id="upTo"></span></h2>
    <div id="drop">Drop files here or click to choose<input type="file" id="file" multiple hidden></div>
    <p class="mute" style="margin:8px 0 0">The file is mirrored to the other bucket automatically.</p>
  </div>

  <div class="card">
    <h2><span>Live data in <span id="viewing"></span></span><span class="mute" id="count"></span></h2>
    <table>
      <thead><tr><th>Name</th><th>Size</th><th>Last modified</th><th>In other bucket?</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card"><h2>Healing log</h2><div id="log"></div></div>
</main>

<script>
let side = 'A', state = null, prev = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB';
const other = s => s === 'A' ? 'B' : 'A';

function log(msg) {
  const d = document.createElement('div');
  d.innerHTML = `<span class="t">${new Date().toLocaleTimeString()}</span> ${msg}`;
  $('log').prepend(d);
}

function diff(cur) {
  if (prev) for (const s of ['A','B']) {
    const p = prev[s], c = cur[s], label = `${c.region}`;
    if (p.up && !c.up) log(`⚠️ Bucket <b>${label}</b> disappeared`);
    if (!p.up && c.up) log(`🩹 Bucket <b>${label}</b> was recreated`);
    if (p.up && c.up) {
      const pk = new Set(p.objects.map(o => o.key)), ck = new Set(c.objects.map(o => o.key));
      pk.forEach(k => { if (!ck.has(k)) log(`⚠️ ${esc(k)} missing from <b>${label}</b>`); });
      ck.forEach(k => { if (!pk.has(k)) log(prev[other(s)].objects.some(o => o.key === k) ? `🩹 ${esc(k)} restored in <b>${label}</b>` : `✅ ${esc(k)} appeared in <b>${label}</b>`); });
    }
  }
  prev = cur;
}

function render() {
  if (!state) return;
  for (const s of ['A','B']) {
    const b = state[s];
    $('tab' + s).innerHTML = `<b>Bucket ${s}</b> <span class="pill ${b.up ? 'ok' : 'bad'}">${b.up ? 'healthy' : 'MISSING – healing'}</span>
      <span class="n">${b.objects.length}<span class="mute"> objects</span></span><span class="mute">${b.name}</span>`;
    $('tab' + s).classList.toggle('active', s === side);
  }
  const cur = state[side], o = state[other(side)];
  $('upTo').textContent = `${cur.region} (Bucket ${side})`;
  $('viewing').textContent = `${cur.region} (Bucket ${side})`;
  $('count').textContent = cur.up ? `${cur.objects.length} objects` : '';
  const otherKeys = new Set(o.objects.map(x => x.key));
  $('rows').innerHTML = !cur.up ? `<tr><td colspan="5" class="bad">Bucket is gone – the healer is recreating it…</td></tr>`
    : cur.objects.length ? cur.objects.map(x => `<tr><td>${esc(x.key)}</td><td>${fmt(x.size)}</td><td>${new Date(x.modified).toLocaleString()}</td>
        <td><span class="pill ${otherKeys.has(x.key) ? 'ok' : 'bad'}">${otherKeys.has(x.key) ? 'mirrored' : 'not yet'}</span></td>
        <td><button class="del" data-k="${encodeURIComponent(x.key)}">Delete</button></td></tr>`).join('')
    : `<tr><td colspan="5" class="mute">Empty – upload something.</td></tr>`;
}

async function refresh() {
  try { state = await (await fetch('/api/state')).json(); diff(state); render(); } catch (e) {}
}

$('tabA').onclick = () => { side = 'A'; render(); };
$('tabB').onclick = () => { side = 'B'; render(); };

$('rows').onclick = async e => {
  const b = e.target.closest('button.del'); if (!b) return;
  const key = decodeURIComponent(b.dataset.k);
  log(`🗑️ Deleting ${esc(key)} from Bucket ${side}…`);
  await fetch(`/api/delete?side=${side}&key=${encodeURIComponent(key)}`, { method: 'POST' });
  refresh();
};

async function upload(files) {
  for (const f of files) {
    log(`⬆️ Uploading ${esc(f.name)} to Bucket ${side}…`);
    const r = await fetch(`/api/upload?side=${side}&key=${encodeURIComponent(f.name)}`, { method: 'PUT', headers: { 'content-type': f.type || 'application/octet-stream' }, body: f });
    if (!r.ok) log(`❌ Upload failed: ${esc((await r.json()).error)}`);
  }
  refresh();
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); upload([...e.dataTransfer.files]); };

refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
